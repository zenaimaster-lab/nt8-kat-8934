name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: xunit suite
        run: dotnet test tests/Kat34Scalper.Tests --nologo
      - name: docs sync
        shell: pwsh
        run: pwsh scripts/Check-DocsSync.ps1
      # compile gate needs NT8 dlls (NinjaTrader.Core/Gui/Custom) — on CI they are absent
      - name: compile gate (no NT8 dlls on CI)
        shell: pwsh
        run: |
          dotnet build tools/CompileCheck --nologo 2>&1 | Tee-Object -FilePath compile.log
          if ($LASTEXITCODE -ne 0) {
            if (Select-String -Path compile.log -Pattern "NinjaTrader\.") {
              Write-Host "::warning::compile gate skipped — NT8 dlls not present on CI, sources parsed OK where possible"
              exit 0
            }
            Write-Host "::error::compile gate failed for non-NT8 reason"
            Get-Content compile.log
            exit 1
          }
